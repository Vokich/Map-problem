{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block extra_head %}
<style>
    .auth-container {
        max-width: 520px;
        margin: 25px auto;
        padding: 35px;
        border: 1px solid #e5e8f5;
        border-radius: 16px;
        background: white;
        box-shadow: 0 12px 35px rgba(70,65,160,.10);
        animation: fadeUp .65s ease both;
    }

    .auth-container h2 {
        margin: 0 0 25px;
        text-align: center;
        font-size: 26px;
    }

    .auth-container form p {
        margin-bottom: 18px;
    }

    .auth-container label {
        display: block;
        margin-bottom: 7px;
        color: #424b65;
        font-weight: 700;
    }

    .auth-container input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dfe2f0;
        border-radius: 8px;
        background: #fafaff;
        font-size: 15px;
        transition: border-color .2s ease, box-shadow .2s ease;
    }

    .auth-container input:focus {
        outline: none;
        border-color: #7666e8;
        box-shadow: 0 0 0 3px rgba(101,88,232,.13);
    }

    .auth-container button {
        width: 100%;
        margin-top: 10px;
    }

    .auth-container ul {
        padding-left: 20px;
        color: #727b91;
        font-size: 13px;
    }

    .error-message {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #f0caca;
        border-radius: 8px;
        background: #fff1f1;
        color: #a33f3f;
    }

    @media (max-width: 600px) {
        .auth-container { padding: 22px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Регистрация</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>

    {% if form.non_field_errors %}
        <div class="error-message">
            {{ form.non_field_errors }}
        </div>
    {% endif %}
</div>
{% endblock %}
