{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="content-card" style="max-width:520px; margin:25px auto;">
    {% if validlink %}
        <h2>Новый пароль</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить пароль</button>
        </form>
    {% else %}
        <h2>Ссылка недействительна</h2>
        <p>Возможно, ссылка уже была использована. Запросите новую.</p>
        <p><a href="{% url 'password_reset' %}">Запросить снова</a></p>
    {% endif %}
</div>
{% endblock %}
