{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="content-card" style="max-width:520px; margin:25px auto;">
    <h2>Восстановление пароля</h2>
    <p>Введите email, указанный при регистрации — мы пришлём ссылку для сброса.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить ссылку</button>
    </form>
</div>
{% endblock %}
