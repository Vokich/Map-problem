{% extends "base.html" %}

{% block title %}Удаление заявки{% endblock %}

{% block extra_head %}
<style>
    .confirm-card {
        max-width: 560px;
        margin: 25px auto;
        padding: 32px;
        border: 1px solid #f0caca;
        border-radius: 16px;
        background: white;
        box-shadow: 0 12px 35px rgba(160,60,60,.10);
        text-align: center;
    }

    .confirm-card h2 {
        margin-top: 0;
        color: #a53d3d;
    }

    .confirm-card p {
        color: #505b75;
    }

    .confirm-actions {
        margin-top: 25px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-danger {
        padding: 11px 20px;
        border-radius: 9px;
        background: #ffe6e6;
        color: #a53d3d;
        font-weight: 700;
        display: inline-block;
    }

    .btn-danger:hover {
        background: #ffcccc;
        color: #8b2626;
    }

    .btn-secondary {
        padding: 10px 16px;
        border-radius: 8px;
        background: #e9ecf4;
        color: #48536a;
        font-weight: 700;
        display: inline-block;
    }

    .btn-secondary:hover {
        background: #dce1ed;
        color: #30394e;
    }
</style>
{% endblock %}

{% block content %}
<div class="confirm-card">
    <h2>Удалить заявку?</h2>
    <p><strong>{{ problem.title }}</strong></p>
    <p>Действие необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <div class="confirm-actions">
            <button type="submit" class="btn-danger">Да, удалить</button>
            <a href="{% url 'problem_detail' problem.pk %}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
