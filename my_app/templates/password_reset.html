{% extends "base.html" %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto;" class="card">
    <h2 style="margin-top:0; font-size: 28px;">Сброс пароля</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Введи свой Email, и мы вышлем ссылку для восстановления.</p>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 24px;"><label>Email</label>{{ form.email }}</div>
        <button type="submit" class="btn" style="width: 100%;">Отправить</button>
    </form>
</div>
{% endblock %}
